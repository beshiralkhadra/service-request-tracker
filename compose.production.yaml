name: service-request-tracker

x-api-image: &api-image
  image: ${API_IMAGE:?Set API_IMAGE}:${IMAGE_TAG:?Set IMAGE_TAG}

x-api-environment: &api-environment
  DATABASE_URL: file:/data/service-request-tracker.db
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  volume-init:
    <<: *api-image
    user: "0:0"
    command: ["sh", "-c", "chown -R node:node /data"]
    restart: "no"
    volumes:
      - service-request-data:/data

  migrate:
    <<: *api-image
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      volume-init:
        condition: service_completed_successfully
    environment:
      <<: *api-environment
    restart: "no"
    volumes:
      - service-request-data:/data

  seed:
    <<: *api-image
    command: ["./node_modules/.bin/tsx", "prisma/seed.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *api-environment
      SEED_AGENT_EMAIL: ${SEED_AGENT_EMAIL:?Set SEED_AGENT_EMAIL}
      SEED_AGENT_NAME: ${SEED_AGENT_NAME:-Support Agent}
      SEED_AGENT_PASSWORD: ${SEED_AGENT_PASSWORD:?Set SEED_AGENT_PASSWORD}
    restart: "no"
    volumes:
      - service-request-data:/data

  api:
    <<: *api-image
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      <<: *api-environment
      API_PORT: 4000
      CORS_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:?Set REFRESH_TOKEN_PEPPER}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      PASSWORD_HASH_ROUNDS: ${PASSWORD_HASH_ROUNDS:-12}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
    restart: unless-stopped
    volumes:
      - service-request-data:/data

  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE}:${IMAGE_TAG:?Set IMAGE_TAG}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  service-request-data:
