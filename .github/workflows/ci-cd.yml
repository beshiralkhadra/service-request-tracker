name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.17.0"

jobs:
  quality:
    name: Quality and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema and client
        run: pnpm db:validate && pnpm db:generate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test with coverage gates
        id: coverage
        run: pnpm test:coverage

      - name: Build applications
        run: pnpm build

      - name: Upload coverage reports
        if: steps.coverage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            apps/api/coverage
            apps/web/coverage
            packages/contracts/coverage
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Playwright lifecycle
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end lifecycle
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  containers:
    name: Container build smoke
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: service-request-tracker-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  publish:
    name: Publish immutable images
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [quality, browser, containers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api-image: ${{ steps.names.outputs.api }}
      web-image: ${{ steps.names.outputs.web }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image names
        id: names
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "api=ghcr.io/${repository}-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${repository}-web" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.api }}:${{ github.sha }}
            ${{ steps.names.outputs.api }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Publish web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: API_INTERNAL_URL=http://api:4000
          tags: |
            ${{ steps.names.outputs.web }}:${{ github.sha }}
            ${{ steps.names.outputs.web }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy production
    if: vars.ENABLE_DEPLOYMENT == 'true'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts ~/.ssh/id_ed25519

      - name: Create deployment environment
        env:
          API_IMAGE: ${{ needs.publish.outputs.api-image }}
          IMAGE_TAG: ${{ github.sha }}
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          WEB_IMAGE: ${{ needs.publish.outputs.web-image }}
        run: |
          mkdir -p .deployment
          {
            printf '%s\n' "$PRODUCTION_ENV_FILE"
            printf 'API_IMAGE=%s\n' "$API_IMAGE"
            printf 'WEB_IMAGE=%s\n' "$WEB_IMAGE"
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG"
          } > .deployment/.env
          cp compose.production.yaml scripts/deploy-production.sh .deployment/

      - name: Upload deployment bundle
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          printf '%s\n' "$DEPLOY_PATH" | \
            ssh "$target" 'IFS= read -r deploy_path; mkdir -p -- "$deploy_path"'
          scp .deployment/.env .deployment/compose.production.yaml \
            .deployment/deploy-production.sh "$target:$DEPLOY_PATH/"

      - name: Pull and deploy images
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          {
            printf '%s\n' "$REGISTRY_USER"
            printf '%s' "$REGISTRY_PASSWORD"
          } | ssh "$target" \
            'IFS= read -r registry_user; docker login ghcr.io -u "$registry_user" --password-stdin'
          printf '%s\n' "$DEPLOY_PATH" | \
            ssh "$target" \
              'IFS= read -r deploy_path; cd "$deploy_path" && sh deploy-production.sh'
